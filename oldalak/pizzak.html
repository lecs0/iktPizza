<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        const kosar = [];

        function kosarba(id) {
            kosar.push(Number(id));
        }

        function rendeles() {
            const params = new URLSearchParams({
                kosar: JSON.stringify(kosar)
            });
            window.location.href = `kosar.html?${params.toString()}`;
        }
    </script>
</head>
<body>
    <button type="button" onclick="rendeles()">Rendelés</button>
    <div class="pizza">
        <p>Pizza 1</p>
        <button type="button" onclick="kosarba('1')">Kosárba</button>
    </div>
    <div class="pizza">
        <p>Pizza 2</p>
        <button type="button" onclick="kosarba('2')">Kosárba</button>
    </div>
    <div class="pizza">
        <p>Pizza 3</p>
        <button type="button" onclick="kosarba('3')">Kosárba</button>
    </div>
    <div class="pizza">
        <p>Pizza 4</p>
        <button type="button" onclick="kosarba('4')">Kosárba</button>
    </div>
    <div class="pizza">
        <p>Pizza 5</p>
        <button type="button" onclick="kosarba('5')">Kosárba</button>
    </div>
</body>
</html>
