<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/css/kosar.css">
    <title>Kosár</title>
    <script>
        const eredetiGetElementById = Document.prototype.getElementById;
        Document.prototype.getElementById = function (id) {
            return eredetiGetElementById.call(this, id === "" ? "kosarCont" : id);
        };
    </script>
    <script src="src/js/kosar.js" defer></script>
</head>

<body>

    <nav class="navbar">
        <!-- Logó -->
        <a href="#" class="logo">
            <span class="logo-icon">LG</span>
            <span class="logo-text">LÉNA ROSSA</span>
        </a>

        <ul class="nav-links">
            <li><a href="index.html">Főoldal</a></li>
            <li><a href="etlap.html">Étlap</a></li>
            <li><a href="support.html">Support</a></li>
        </ul>

    </nav>

    <main class="master-container">
        <div class="card cart">
            <h1 class="title">Kosár</h1>
            <div class="products" id="kosarCont">
                <!-- Kosár tartalma ide kerül -->
            </div>
        </div>

        <div class="card coupons">
            <h2 class="title">Kupon beváltása</h2>
            <form id="kuponForm">
                <label class="sr-only" for="kuponInput">Kuponkód</label>
                <input type="text" placeholder="Írd be a kuponkódot" class="input_field" id="kuponInput"
                    autocomplete="off">
                <button type="submit">Beváltás</button>
            </form>
            <p class="coupon-message" id="kuponUzenet" role="status" aria-live="polite"></p>
        </div>

        <div class="card checkout">
            <h2 class="title">Összesítés</h2>
            <div class="details">
                <span>Részösszeg:</span>
                <span id="reszosszeg">0 Ft</span>
                <span>Kuponkedvezmény:</span>
                <span id="kedvezmeny">0 Ft</span>
                <span>Szállítási díj:</span>
                <span id="szallitasiDij">300 Ft</span>
            </div>
            <form class="checkout-form" id="checkoutForm">
                <h3>Szállítási adatok</h3>
                <div class="form-row">
                    <label for="nev">Név</label>
                    <input id="nev" name="nev" type="text" autocomplete="name" required>
                </div>
                <div class="form-row">
                    <label for="telefon">Telefonszám</label>
                    <input id="telefon" name="telefon" type="tel" autocomplete="tel" required>
                </div>
                <div class="form-row">
                    <label for="cim">Szállítási cím</label>
                    <input id="cim" name="cim" type="text" autocomplete="street-address" required>
                </div>
                <div class="form-row">
                    <label for="fizetes">Fizetési mód</label>
                    <select id="fizetes" name="fizetes">
                        <option value="utanvet">Utánvét</option>
                        <option value="kartya">Bankkártya átvételkor</option>
                    </select>
                </div>
                <div class="checkout--footer">
                    <span class="price"><span id="vegosszeg">0</span><sup> Ft</sup></span>
                    <button type="submit" class="checkout-btn">Rendelés leadása</button>
                </div>
            </form>
            <p class="checkout-message" id="checkoutUzenet" role="status" aria-live="polite"></p>
        </div>
    </main>

</body>

</html>
